<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ziegel 24</title>
</head>

<body>

<h1>Ziegel 24 Onlineshop</h1>
<h2>Produkte</h2>

<table>

    <tr>
    <th>Name</th>
    <th>Price</th>
    <th>Menge</th>
    </tr>

    <tr th:each="produkt :${produkten}">
        <td th:text=${"produkt.name"}>produktName:</td>
        <td th:value="${produkt.price} + 'euro' ">produktPrice:</td>





    </tr>




</table>


</body>

</html>
