<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ziegel 24</title>
</head>

<body>

<h1>Ziegel 24 Onlineshop</h1>
<h2>Produkte</h2>

<table>

    <tr>
    <th>Name</th>
    <th>Price</th>
    <th>Menge</th>
    </tr>

    <tr th:each="produkt :${produkten}">
        <td th:text="${produkt.name}">produktName:</td>
        <td th:text="${produkt.price} + 'euro' ">produktPrice:</td>

        <form method="post" action="/add">
        <td>
            <input type="hidden" name="id" th:value="${produkt.id}">
            <input type="number" name="menge" value="1" min="1">
        </td>


           <td> <button type="submit">Add</button>
           </td>
        </form>

    </tr>

</table>


</body>

</html>
